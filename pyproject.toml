[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymdm-update"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
tinymdm-update = "tinymdm_update:main"

[tool.setuptools]
py-modules = ["tinymdm_update"]
